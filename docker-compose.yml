version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Midmar LifeOS Application & Native Server
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midmar_app
    restart: always
    ports:
      - "${PORT:-80}:80"
    environment:
      - PORT=80
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DATABASE_URL=postgresql://${POSTGRES_USER:-midmar}:${POSTGRES_PASSWORD:-midmar_secret_password_2026}@postgres:5432/${POSTGRES_DB:-midmar}
      # Optional AI Keys (can be set directly in Coolify UI):
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - midmar_data:/app/data

  # ----------------------------------------------------------------------------
  # 2. Centralized PostgreSQL Database Engine (v16 Alpine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: midmar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midmar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midmar_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-midmar}
    volumes:
      - midmar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-midmar} -d $${POSTGRES_DB:-midmar}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  midmar_data:
    name: midmar_data
  midmar_postgres_data:
    name: midmar_postgres_data
