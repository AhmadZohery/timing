name: CI Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Lint, Test & State Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Full TypeScript typecheck
        run: npx tsc -b

      - name: Fast Rust-based oxlint linter
        run: npm run lint

      - name: Automated Vitest test suite
        run: npm test

      - name: Compile canonical project state & dashboard
        run: node scripts/state.mjs compile

      - name: Production bundle verification
        run: npm run build
