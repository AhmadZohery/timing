<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian & Royal Emerald Sanctuary Canvas -->
    <radialGradient id="midmarCanvas" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0d3b2e" />
      <stop offset="45%" stop-color="#071f18" />
      <stop offset="80%" stop-color="#061014" />
      <stop offset="100%" stop-color="#030709" />
    </radialGradient>

    <!-- Royal Gold Filigree Gradient -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Luminous Emerald Jewel Gradient -->
    <linearGradient id="emeraldJewel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Inner Mihrab Dome Glow -->
    <radialGradient id="mihrabGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. Luxury Obsidian-Emerald Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#midmarCanvas)" />

  <!-- 2. Outer Gold Filigree Frame -->
  <rect x="18" y="18" width="476" height="476" rx="96" ry="96" fill="none" stroke="url(#royalGold)" stroke-width="3" stroke-opacity="0.42" />

  <!-- 3. Sacred Mihrab Radial Aura -->
  <circle cx="256" cy="256" r="190" fill="url(#mihrabGlow)" />

  <!-- 4. Sculpted Mamluk Pointed Mihrab Archway -->
  <path
    d="M 106 424 V 236 C 106 146 172 94 256 54 C 340 94 406 146 406 236 V 424 Z"
    fill="#071a15"
    fill-opacity="0.75"
    stroke="url(#royalGold)"
    stroke-width="6"
    filter="url(#emblemShadow)"
  />
  <path
    d="M 124 410 V 240 C 124 160 182 112 256 76 C 330 112 388 160 388 240 V 410"
    fill="none"
    stroke="url(#emeraldJewel)"
    stroke-width="2.5"
    stroke-dasharray="8 6"
    stroke-opacity="0.75"
  />

  <!-- 5. 8-Pointed Islamic Rub el Hizb Star (نجمة الحزب والشمسة المملوكية) -->
  <g filter="url(#emblemShadow)" transform="translate(256, 252)">
    <!-- Square 1 (0 deg) -->
    <rect
      x="-88"
      y="-88"
      width="176"
      height="176"
      rx="14"
      fill="url(#emeraldJewel)"
      stroke="url(#royalGold)"
      stroke-width="6"
    />
    <!-- Square 2 (45 deg) -->
    <rect
      x="-88"
      y="-88"
      width="176"
      height="176"
      rx="14"
      transform="rotate(45)"
      fill="#064e3b"
      stroke="url(#royalGold)"
      stroke-width="6"
    />

    <!-- Inner Golden Octagon Ring -->
    <circle cx="0" cy="0" r="62" fill="#051310" stroke="url(#royalGold)" stroke-width="4" />

    <!-- Golden Crescent Moon Cradle inside the Star -->
    <path
      d="M -34 -8 A 38 38 0 1 0 34 -8 A 30 30 0 1 1 -34 -8 Z"
      fill="url(#royalGold)"
    />

    <!-- Ascending Compass / Minaret Zenith Diamond (البوصلة والسمو) -->
    <polygon
      points="0,-46 13,-12 0,10 -13,-12"
      fill="url(#royalGold)"
    />
    <polygon
      points="0,-46 13,-12 0,-18"
      fill="#ffffff"
      opacity="0.55"
    />
    <circle cx="0" cy="-12" r="4.5" fill="#051310" />
  </g>

  <!-- 6. Base Horizon Foundation Pedestal -->
  <path
    d="M 86 424 H 426"
    stroke="url(#royalGold)"
    stroke-width="6"
    stroke-linecap="round"
  />
  <path
    d="M 136 444 H 376"
    stroke="url(#emeraldJewel)"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.8"
  />
</svg>